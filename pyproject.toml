[project]
name = "rush-py"
version = "6.10.0"
description = "Python client for QDX's Rush platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
  { name = "Sean Laguna", email = "seanlaguna@qdx.co" },
]
dependencies = [
  "gql~=4.0",
  "h5py~=3.14",
  "rdkit~=2025.9.2",
  "matplotlib~=3.10",
  "networkx~=3.6",
  "requests~=2.32",
  "requests_toolbelt~=1.0",
  "zstandard~=0.23",
]
keywords = [
  "computational-chemistry",
  "quantum-chemistry",
  "HPC",
  "molecular-modeling",
  "protein-folding",
  "EXESS",
  "NN-xTB",
  "PBSA",
]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Intended Audience :: Healthcare Industry",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: System :: Distributed Computing",
]

[project.urls]
Homepage = "https://rush.cloud"
Documentation = "https://talo.github.io/rush-py"
Source = "https://github.com/talo/rush-py"
Issues = "https://github.com/talo/rush-py/issues"

[dependency-groups]
dev = [
  "ruff",
  "ty",
  "pytest~=9.0",
  "pytest-timeout~=2.3",
  "sphinx~=8.2",
  "sphinx-autodoc-typehints~=3.5",
  "sphinx-design~=0.6",
  "myst-parser~=4.0",
  "shibuya>=2025.12.19",
  "py3Dmol~=2.5",
  "scipy~=1.17",
]

[tool.pytest.ini_options]
timeout = 300
markers = [
  "slow: marks tests that submit jobs to the Rush API (auto-applied, skipped when queues busy)",
]

[tool.uv.build-backend]
module-name = "rush"

[build-system]
requires = ["uv_build~=0.9"]
build-backend = "uv_build"
