name: Pytest

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUSH_ENDPOINT: https://tengu-server-staging-api-720805281970.asia-southeast1.run.app
      RUSH_PROJECT: f2df7579-725d-4aca-b2fb-6e48ebf30aca
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests
        env:
          RUSH_TOKEN: ${{ secrets.RUSH_TOKEN }}
        run: uv run pytest -v

      - name: Run ruff
        run: ruff check --output-format=github ./src ./tests

      - name: Run ty
        run: ty check --output-format=github ./src ./tests
