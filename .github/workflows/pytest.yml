name: Pytest

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSH_TOKEN: ${{ secrets.TENGU_STAGING_ADMIN_TOKEN }}
      RUSH_ENDPOINT: https://tengu-server-staging-api-720805281970.asia-southeast1.run.app/
      RUSH_PROJECT: b6761e4b-4a08-4618-be63-5e173b6991ac
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests
        run: uv run pytest -v
