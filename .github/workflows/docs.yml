name: Build and Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'src/rush/**'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --dev

      - name: Build docs
        run: uv run sphinx-build -b html docs/ docs/_build/html

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/_build/html

      - name: Push docs to qdx-main-landing
        env:
          GH_TOKEN: ${{ secrets.DOCS_DEPLOY_PAT }}
        run: |
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/talo/qdx-main-landing.git" /tmp/qdx-main-landing
          cd /tmp/qdx-main-landing
          git switch docs-update 2>/dev/null || git switch -c docs-update
          mkdir -p public/docs
          cp -r "$GITHUB_WORKSPACE/docs/_build/html/." public/docs/
          git add public/docs
          if git diff --cached --quiet; then
            echo "No docs changes to push"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "Update docs from rush-py commit ${GITHUB_SHA}"
            git push origin docs-update
          fi

      - name: Create or update PR in qdx-main-landing
        env:
          GH_TOKEN: ${{ secrets.DOCS_DEPLOY_PAT }}
        run: |
          existing=$(gh pr list \
            --repo talo/qdx-main-landing \
            --head docs-update \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh pr comment "$existing" \
              --repo talo/qdx-main-landing \
              --body "Updated docs from rush-py commit ${{ github.sha }}"
          else
            gh pr create \
              --repo talo/qdx-main-landing \
              --head docs-update \
              --base main \
              --title "Update docs from rush-py" \
              --body "Automated docs update from rush-py commit ${{ github.sha }}"
          fi
